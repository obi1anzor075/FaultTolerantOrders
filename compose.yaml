services:
  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: labpass
    ports:
      - "5433:5432"
    volumes:
      - order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: labpass
    ports:
      - "5434:5432"
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: labpass
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  order-api:
    build:
      context: .
      dockerfile: src/OrderService.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Orders: Host=order-db;Database=orders;Username=lab;Password=labpass
      RabbitMq__Uri: amqp://lab:labpass@rabbitmq:5672
    ports:
      - "8080:8080"
    depends_on:
      order-db:
        condition: service_healthy
    restart: on-failure

  notification-worker:
    build:
      context: .
      dockerfile: src/NotificationService.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Notifications: Host=notification-db;Database=notifications;Username=lab;Password=labpass
      RabbitMq__Uri: amqp://lab:labpass@rabbitmq:5672
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  order-data:
  notification-data:
